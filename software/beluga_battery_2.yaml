substitutions:
  name: beluga-betty-2
  friendly_name: Beluga Betty 2

packages:
  esphome.bluetooth-proxy: "github://esphome/bluetooth-proxies/olimex/olimex-esp32-poe-iso.yaml@main"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

# Keep this API key in the local secrets.yaml, never in the repository.
api:
  encryption:
    key: !secret beluga_betty_2_api_key

# The package supplies Ethernet, logger, OTA, and Bluetooth proxy configuration.
# This board keeps its local I2C bus for the ADS1115.
esp32:
  board: esp32-poe-iso
  variant: esp32
  framework:
    type: esp-idf

i2c:
  sda: GPIO13
  scl: GPIO16
  scan: true

# This board has its own I2C bus; its ADS1115 address can therefore be 0x48.
ads1115:
  - id: ads1115_0x48
    address: 0x48

# Divider per channel: 3.3 V -> fixed 10 kOhm -> ADC node -> NTC -> GND.
# NTC: Semitec 103JT-100, 10 kOhm at 25 C, beta 3435 K (datasheet).
# Supply the NTC beta value through ntc_beta_k in the local secrets.yaml.
sensor:
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A0_GND
    gain: 4.096
    name: "Beluga NTC 5 Voltage"
    id: ntc5_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc5_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 5 Resistance"
    id: ntc5_resistance


  - platform: ntc
    sensor: ntc5_resistance
    name: "Beluga NTC 5 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A1_GND
    gain: 4.096
    name: "Beluga NTC 6 Voltage"
    id: ntc6_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc6_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 6 Resistance"
    id: ntc6_resistance


  - platform: ntc
    sensor: ntc6_resistance
    name: "Beluga NTC 6 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A2_GND
    gain: 4.096
    name: "Beluga NTC 7 Voltage"
    id: ntc7_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc7_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 7 Resistance"
    id: ntc7_resistance


  - platform: ntc
    sensor: ntc7_resistance
    name: "Beluga NTC 7 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A3_GND
    gain: 4.096
    name: "Beluga NTC 8 Voltage"
    id: ntc8_voltage
    update_interval: 5s

  - platform: resistance
    sensor: ntc8_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 8 Resistance"
    id: ntc8_resistance

  - platform: ntc
    sensor: ntc8_resistance
    name: "Beluga NTC 8 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm
