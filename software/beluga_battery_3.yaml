substitutions:
  name: beluga-battery-3
  friendly_name: Beluga Battery 3

packages:
  esphome.bluetooth-proxy: "github://esphome/bluetooth-proxies/olimex/olimex-esp32-poe-iso.yaml@main"

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

# Keep this API key in the local secrets.yaml, never in the repository.
api:
  encryption:
    key: !secret beluga_battery_3_api_key

# The package supplies Ethernet, logger, OTA, and Bluetooth proxy configuration.
# This board keeps its local I2C bus for the ADS1115.
esp32:
  board: esp32-poe-iso
  variant: esp32
  framework:
    type: esp-idf

i2c:
  sda: GPIO13
  scl: GPIO16
  scan: true

# This board has its own I²C bus; its ADS1115 address can therefore be 0x48.
ads1115:
  - id: ads1115_0x48
    address: 0x48

# Divider per channel: 3.3 V -> fixed 10 kΩ -> ADC node -> NTC -> GND.
# NTC: Semitec 103JT-100, 10 kΩ at 25 °C, beta 3435 K (datasheet).
# Supply the NTC beta value through ntc_beta_k in the local secrets.yaml.
sensor:
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A0_GND
    gain: 4.096
    name: "Beluga NTC 9 Voltage"
    id: ntc9_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc9_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 9 Resistance"
    id: ntc9_resistance


  - platform: ntc
    sensor: ntc9_resistance
    name: "Beluga NTC 9 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A1_GND
    gain: 4.096
    name: "Beluga NTC 10 Voltage"
    id: ntc10_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc10_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 10 Resistance"
    id: ntc10_resistance


  - platform: ntc
    sensor: ntc10_resistance
    name: "Beluga NTC 10 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A2_GND
    gain: 4.096
    name: "Beluga NTC 11 Voltage"
    id: ntc11_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc11_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 11 Resistance"
    id: ntc11_resistance


  - platform: ntc
    sensor: ntc11_resistance
    name: "Beluga NTC 11 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A3_GND
    gain: 4.096
    name: "Beluga NTC 12 Voltage"
    id: ntc12_voltage
    update_interval: 5s

  - platform: resistance
    sensor: ntc12_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 12 Resistance"
    id: ntc12_resistance

  - platform: ntc
    sensor: ntc12_resistance
    name: "Beluga NTC 12 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm
