esphome:
  name: beluga-battery
  friendly_name: Beluga Battery

esp32:
  board: esp32-poe-iso
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true

i2c:
  sda: GPIO13
  scl: GPIO16
  scan: true

ads1115:
  # Each Olimex board has an independent I²C bus, so both ADS1115 modules use 0x48.
  - id: ads1115_0x48
    address: 0x48

sensor:
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A0_GND
    gain: 4.096
    name: "Beluga NTC 1 Voltage"
    id: ntc1_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc1_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 1 Resistance"
    id: ntc1_resistance


  - platform: ntc
    sensor: ntc1_resistance
    name: "Beluga NTC 1 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A1_GND
    gain: 4.096
    name: "Beluga NTC 2 Voltage"
