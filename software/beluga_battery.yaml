esphome:
  name: beluga-battery
  friendly_name: Beluga Battery

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true

ads1115:
  - id: ads1115_0x48
    address: 0x48
  - id: ads1115_0x49
    address: 0x49

sensor:
  # Raw divider-node voltages. One independent 10 kΩ + 10 kΩ branch per input.
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A0_GND
    gain: 4.096
    name: "Beluga NTC 1 Spannung"
    id: ntc1_voltage
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A1_GND
    gain: 4.096
    name: "Beluga NTC 2 Spannung"
    id: ntc2_voltage
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A2_GND
    gain: 4.096
    name: "Beluga NTC 3 Spannung"
    id: ntc3_voltage
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A3_GND
    gain: 4.096
    name: "Beluga NTC 4 Spannung"
    id: ntc4_voltage
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads1115_0x49
    multiplexer: A0_GND
    gain: 4.096
    name: "Beluga NTC 5 Spannung"
    id: ntc5_voltage
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads1115_0x49
    multiplexer: A1_GND
    gain: 4.096
    name: "Beluga NTC 6 Spannung"
    id: ntc6_voltage
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads1115_0x49
    multiplexer: A2_GND
    gain: 4.096
    name: "Beluga NTC 7 Spannung"
    id: ntc7_voltage
    update_interval: 5s

  - platform: ads1115
    ads1115_id: ads1115_0x49
    multiplexer: A3_GND
    gain: 4.096
    name: "Beluga NTC 8 Spannung"
    id: ntc8_voltage
    update_interval: 5s

  # Divider: 3.3 V -> fixed 10 kΩ -> ADC node -> NTC -> GND.
  - platform: resistance
    sensor: ntc1_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 1 Widerstand"
    id: ntc1_resistance

  - platform: resistance
    sensor: ntc2_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 2 Widerstand"
    id: ntc2_resistance

  - platform: resistance
    sensor: ntc3_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 3 Widerstand"
    id: ntc3_resistance

  - platform: resistance
    sensor: ntc4_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 4 Widerstand"
    id: ntc4_resistance

  - platform: resistance
    sensor: ntc5_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 5 Widerstand"
    id: ntc5_resistance

  - platform: resistance
    sensor: ntc6_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 6 Widerstand"
    id: ntc6_resistance

  - platform: resistance
    sensor: ntc7_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 7 Widerstand"
    id: ntc7_resistance

  - platform: resistance
    sensor: ntc8_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 8 Widerstand"
    id: ntc8_resistance

  - platform: ntc
    sensor: ntc1_resistance
    name: "Beluga NTC 1 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: ntc
    sensor: ntc2_resistance
    name: "Beluga NTC 2 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: ntc
    sensor: ntc3_resistance
    name: "Beluga NTC 3 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: ntc
    sensor: ntc4_resistance
    name: "Beluga NTC 4 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: ntc
    sensor: ntc5_resistance
    name: "Beluga NTC 5 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: ntc
    sensor: ntc6_resistance
    name: "Beluga NTC 6 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: ntc
    sensor: ntc7_resistance
    name: "Beluga NTC 7 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm

  - platform: ntc
    sensor: ntc8_resistance
    name: "Beluga NTC 8 Temperatur"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm
