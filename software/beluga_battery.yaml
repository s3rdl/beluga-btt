substitutions:
  name: beluga-battery
  friendly_name: Beluga Battery

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

esp32:
  board: esp32-poe-iso
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0
  power_pin:
    number: GPIO12
    ignore_strapping_warning: true

i2c:
  sda: GPIO13
  scl: GPIO16
  scan: true

# This board has its own I²C bus; its ADS1115 address can therefore be 0x48.
ads1115:
  - id: ads1115_0x48
    address: 0x48

# Divider per channel: 3.3 V -> fixed 10 kΩ -> ADC node -> NTC -> GND.
# NTC: Semitec 103JT-100, 10 kΩ at 25 °C, beta 3435 K (datasheet).
# Supply the NTC beta value through ntc_beta_k in the local secrets.yaml.
sensor:
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A0_GND
    gain: 4.096
    name: "Beluga NTC 1 Voltage"
    id: ntc1_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc1_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 1 Resistance"
    id: ntc1_resistance


  - platform: ntc
    sensor: ntc1_resistance
    name: "Beluga NTC 1 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A1_GND
    gain: 4.096
    name: "Beluga NTC 2 Voltage"
    id: ntc2_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc2_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 2 Resistance"
    id: ntc2_resistance


  - platform: ntc
    sensor: ntc2_resistance
    name: "Beluga NTC 2 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A2_GND
    gain: 4.096
    name: "Beluga NTC 3 Voltage"
    id: ntc3_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc3_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 3 Resistance"
    id: ntc3_resistance


  - platform: ntc
    sensor: ntc3_resistance
    name: "Beluga NTC 3 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm


  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: A3_GND
    gain: 4.096
    name: "Beluga NTC 4 Voltage"
    id: ntc4_voltage
    update_interval: 5s


  - platform: resistance
    sensor: ntc4_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: "Beluga NTC 4 Resistance"
    id: ntc4_resistance


  - platform: ntc
    sensor: ntc4_resistance
    name: "Beluga NTC 4 Temperature"
    calibration:
      b_constant: !secret ntc_beta_k
      reference_temperature: 25°C
      reference_resistance: 10kOhm
