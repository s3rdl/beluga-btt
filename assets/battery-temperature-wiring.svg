<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title description">
<title id="title">Beluga Battery: eight-channel NTC temperature wiring</title>
<desc id="description">ESP32-C3 DevKitM-1 on I²C GPIO5 and GPIO6 connects two ADS1115 ADCs at addresses 0x48 and 0x49. NTCs 1 through 4 use AIN0 through AIN3 on 0x48; NTCs 5 through 8 use AIN0 through AIN3 on 0x49. Each separate divider runs from 3.3 volts through a 10 kiloohm fixed resistor to the ADC node, then through an NTC to ground.</desc>
<defs>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:16}.head{font:700 30px Arial,sans-serif;fill:#0f172a}.sub{font:16px Arial,sans-serif;fill:#475569}.label{font:700 18px Arial,sans-serif;fill:#0f172a}.small{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.wire{stroke:#2563eb;stroke-width:3;fill:none}.gnd{stroke:#475569;stroke-width:3;fill:none}.i2c{stroke:#7c3aed;stroke-width:3;fill:none}.node{fill:#0f172a}.chip{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:12}.res{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:5}.ntc{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:5}.note{fill:#fffbeb;stroke:#f59e0b;stroke-width:2;rx:12}
  </style>
</defs>
<rect class="bg" width="1400" height="1000"/>
<text class="head" x="50" y="56">Battery temperature monitoring – eight NTC channels</text>
<text class="sub" x="50" y="86">ESP32-C3 DevKitM-1 · ESPHome · two ADS1115 ADCs powered from 3.3 V</text>

<!-- controller panel -->
<rect class="panel" x="50" y="125" width="380" height="370"/>
<text class="label" x="78" y="165">ESP32-C3 DevKitM-1</text>
<text class="small" x="78" y="207">3V3 → both ADC VDD pins and dividers</text>
<text class="small" x="78" y="240">GND → both ADC GND pins and NTCs</text>
<text class="small" x="78" y="273">GPIO5 / SDA → both ADC SDA pins</text>
<text class="small" x="78" y="306">GPIO6 / SCL → both ADC SCL pins</text>
<text class="small" x="78" y="365">All eight branches share a common GND.</text>
<text class="tiny" x="78" y="425">ESPHome exposes voltage, resistance, and</text>
<text class="tiny" x="78" y="448">temperature sensors to Home Assistant.</text>

<!-- ADS panels -->
<rect class="chip" x="500" y="145" width="360" height="145"/>
<text class="label" x="525" y="180">ADS1115 #1 · address 0x48</text>
<text class="small" x="525" y="214">VDD → 3V3 · GND → common GND</text>
<text class="small" x="525" y="243">SDA/SCL → ESP32 · ADDR → GND</text>
<text class="tiny" x="525" y="272">AIN0–AIN3 → NTC 1–4</text>
<rect class="chip" x="500" y="325" width="360" height="145"/>
<text class="label" x="525" y="360">ADS1115 #2 · address 0x49</text>
<text class="small" x="525" y="394">VDD → 3V3 · GND → common GND</text>
<text class="small" x="525" y="423">SDA/SCL → ESP32 · ADDR → 3V3</text>
<text class="tiny" x="525" y="452">AIN0–AIN3 → NTC 5–8</text>

<!-- I2C link -->
<path class="i2c" d="M430 260 H470 V215 H500 M470 260 V395 H500"/>
<text class="tiny" x="438" y="245" fill="#7c3aed">I²C</text>

<!-- divider panel -->
<rect class="panel" x="900" y="125" width="450" height="565"/>
<text class="label" x="930" y="165">One divider branch (repeat 8×)</text>
<text class="small" x="930" y="198">3V3</text>
<path class="wire" d="M965 192 V235"/><circle class="node" cx="965" cy="235" r="5"/>
<rect class="res" x="935" y="235" width="60" height="42"/><text class="small" x="947" y="262">10 kΩ</text>
<path class="wire" d="M965 277 V325 H1020"/><circle class="node" cx="965" cy="325" r="5"/>
<rect class="ntc" x="1020" y="304" width="100" height="42"/><text class="small" x="1050" y="331">NTC</text>
<path class="gnd" d="M1120 325 V375 M1095 375 H1145 M1102 384 H1138 M1110 393 H1130"/>
<path class="wire" d="M965 325 V420 H1210"/><text class="small" x="1220" y="426">AINx</text>
<text class="tiny" x="930" y="455">Fixed resistor: 10 kΩ (top, at 3V3).</text>
<text class="tiny" x="930" y="481">Connect the resistor–NTC node to AINx.</text>
<text class="tiny" x="930" y="507">NTC connects the node to GND.</text>
<line x1="930" y1="535" x2="1320" y2="535" stroke="#cbd5e1" stroke-width="2"/>
<text class="small" x="930" y="570">Eight independent branches:</text>
<text class="small" x="930" y="598">one resistor, NTC, and AIN per channel.</text>
<text class="tiny" x="930" y="645">Assumed NTC: 10 kΩ at 25 °C; verify datasheet.</text>

<!-- eight channels list -->
<rect class="panel" x="50" y="535" width="810" height="300"/>
<text class="label" x="78" y="575">Channel mapping</text>
<text class="small" x="80" y="620">NTC 1 → 0x48 AIN0</text><text class="small" x="80" y="660">NTC 2 → 0x48 AIN1</text><text class="small" x="80" y="700">NTC 3 → 0x48 AIN2</text><text class="small" x="80" y="740">NTC 4 → 0x48 AIN3</text>
<text class="small" x="420" y="620">NTC 5 → 0x49 AIN0</text><text class="small" x="420" y="660">NTC 6 → 0x49 AIN1</text><text class="small" x="420" y="700">NTC 7 → 0x49 AIN2</text><text class="small" x="420" y="740">NTC 8 → 0x49 AIN3</text>
<text class="tiny" x="80" y="800">Both ADCs use all four inputs; ESPHome gain: 4.096 V.</text>

<rect class="note" x="50" y="865" width="1300" height="90"/>
<text class="label" x="78" y="900">Notes</text>
<text class="small" x="250" y="900">Electrically isolate NTC probes when attaching them to a battery.</text>
<text class="small" x="250" y="930">Verify NTC beta and 10 kΩ at 25 °C against the datasheet before using temperatures.</text>
</svg>
