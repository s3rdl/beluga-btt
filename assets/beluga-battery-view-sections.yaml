# Beluga Battery view, re-formatted as a sections view for the new section UI.
# Same cards and entities; each sensor stack is its own grid section.
title: "Beluga Battery"
path: "beluga-battery"
icon: "fas:ship"
type: "sections"
max_columns: 4
