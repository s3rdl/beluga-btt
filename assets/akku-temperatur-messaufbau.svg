<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<defs>
  <style>
    .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:16}.head{font:700 30px Arial,sans-serif;fill:#0f172a}.sub{font:16px Arial,sans-serif;fill:#475569}.label{font:700 18px Arial,sans-serif;fill:#0f172a}.small{font:15px Arial,sans-serif;fill:#334155}.tiny{font:13px Arial,sans-serif;fill:#475569}.wire{stroke:#2563eb;stroke-width:3;fill:none}.gnd{stroke:#475569;stroke-width:3;fill:none}.i2c{stroke:#7c3aed;stroke-width:3;fill:none}.node{fill:#0f172a}.chip{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:12}.res{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:5}.ntc{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:5}.note{fill:#fffbeb;stroke:#f59e0b;stroke-width:2;rx:12}
  </style>
</defs>
<rect class="bg" width="1400" height="1000"/>
<text class="head" x="50" y="56">Akku-Temperaturmessung – 6 × 10-kΩ-Dünnschicht-NTC</text>
<text class="sub" x="50" y="86">Annahme: ESP32-C3 DevKitM-1 · ESPHome · zwei ADS1115 mit 3,3-V-Versorgung</text>

<!-- controller panel -->
<rect class="panel" x="50" y="125" width="380" height="370"/>
<text class="label" x="78" y="165">ESP32-C3</text>
<text class="small" x="78" y="200">3V3  ────────────────┬──────── ADS1 VDD</text>
<text class="small" x="78" y="230">GND  ────────────────┼──────── ADS2 GND</text>
<text class="small" x="78" y="260">GPIO5 / SDA ─────────┼──────── beide SDA</text>
<text class="small" x="78" y="290">GPIO6 / SCL ─────────┴──────── beide SCL</text>
<text class="small" x="78" y="337">Gemeinsame Masse für ESP32, ADCs</text>
<text class="small" x="78" y="362">und alle sechs NTC-Messzweige.</text>
<text class="tiny" x="78" y="415">ESPHome stellt die sechs Messwerte als</text>
<text class="tiny" x="78" y="437">Sensoren in Home Assistant bereit.</text>
<text class="tiny" x="78" y="475">GPIO5/6 gemäß deinem bisherigen C3-Aufbau.</text>

<!-- ADS panels -->
<rect class="chip" x="500" y="145" width="360" height="145"/>
<text class="label" x="525" y="180">ADS1115 Nr. 1 · Adresse 0x48</text>
<text class="small" x="525" y="214">VDD → 3V3 · GND → gemeinsame Masse</text>
<text class="small" x="525" y="243">SDA/SCL → ESP32 · ADDR → GND</text>
<text class="tiny" x="525" y="272">AIN0, AIN1, AIN2 = Sensoren 1–3</text>
<rect class="chip" x="500" y="325" width="360" height="145"/>
<text class="label" x="525" y="360">ADS1115 Nr. 2 · Adresse 0x49</text>
<text class="small" x="525" y="394">VDD → 3V3 · GND → gemeinsame Masse</text>
<text class="small" x="525" y="423">SDA/SCL → ESP32 · ADDR → 3V3</text>
<text class="tiny" x="525" y="452">AIN0, AIN1, AIN2 = Sensoren 4–6</text>

<!-- I2C link -->
<path class="i2c" d="M430 260 H470 V215 H500 M470 260 V395 H500"/>
<text class="tiny" x="438" y="245" fill="#7c3aed">I²C</text>

<!-- divider panel -->
<rect class="panel" x="900" y="125" width="450" height="565"/>
<text class="label" x="930" y="165">Ein Messzweig (6× identisch)</text>
<text class="small" x="930" y="198">3V3</text>
<path class="wire" d="M965 192 V235"/><circle class="node" cx="965" cy="235" r="5"/>
<rect class="res" x="935" y="235" width="60" height="42"/><text class="small" x="947" y="262">10 kΩ</text>
<path class="wire" d="M965 277 V325 H1120"/><circle class="node" cx="965" cy="325" r="5"/>
<path class="wire" d="M965 325 H1020"/><rect class="ntc" x="1020" y="304" width="100" height="42"/><text class="small" x="1037" y="331">NTC 10 kΩ</text>
<path class="gnd" d="M1120 325 V375 M1095 375 H1145 M1102 384 H1138 M1110 393 H1130"/>
<path class="wire" d="M965 325 V420 H1210"/><text class="small" x="1220" y="426">AINx</text>
<text class="tiny" x="930" y="455">Festwiderstand: 10 kΩ, möglichst 0,1 %</text>
<text class="tiny" x="930" y="481">Knoten zwischen R und NTC an den ADC-Eingang.</text>
<text class="tiny" x="930" y="507">NTC unten an GND; R oben an 3V3.</text>
<line x1="930" y1="535" x2="1320" y2="535" stroke="#cbd5e1" stroke-width="2"/>
<text class="small" x="930" y="570">6 getrennte Zweige, keine NTCs parallel:</text>
<text class="small" x="930" y="598">Je ein eigener R, NTC und AIN-Kanal.</text>
<text class="tiny" x="930" y="645">Die dargestellte Messspitze ist elektrisch isoliert.</text>

<!-- six channels list -->
<rect class="panel" x="50" y="535" width="810" height="300"/>
<text class="label" x="78" y="575">Kanalzuordnung</text>
<text class="small" x="80" y="620">NTC 1 → ADS1 AIN0</text><text class="small" x="80" y="660">NTC 2 → ADS1 AIN1</text><text class="small" x="80" y="700">NTC 3 → ADS1 AIN2</text>
<text class="small" x="420" y="620">NTC 4 → ADS2 AIN0</text><text class="small" x="420" y="660">NTC 5 → ADS2 AIN1</text><text class="small" x="420" y="700">NTC 6 → ADS2 AIN2</text>
<text class="tiny" x="80" y="770">AIN3 bleibt frei. Für ADS1115 in ESPHome 16 Bit und PGA gain 4.096 V verwenden.</text>
<text class="tiny" x="80" y="800">ADS1 ADDR→GND (0x48); ADS2 ADDR→3V3 (0x49). ALERT/RDY bleibt unbeschaltet.</text>

<rect class="note" x="50" y="865" width="1300" height="90"/>
<text class="label" x="78" y="900">Montagehinweis</text>
<text class="small" x="250" y="900">Nur die dünne Fühlerspitze in den Spalt legen; Zellen nicht spreizen. Leitungen seitlich herausführen.</text>
<text class="small" x="250" y="930">ESP32/ADCs nicht aus dem Akku-Prüfling speisen. Ladegerät/BMS behalten die unabhängige Schutzfunktion.</text>
</svg>
